server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    mcp:
      server:
        name: engineering-bench-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: >
          Engineering Bench MCP server providing semantic search
          over engineering documentation.
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

app:
  openai-key: ${OPENAI_API_KEY}
  qdrant-host: ${QDRANT_HOST:qdrant}
  qdrant-port: ${QDRANT_PORT:6334}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/engineering_bench}
    username: ${DB_USERNAME:engineering_bench}
    password: ${DB_PASSWORD}
  ai:
    mcp:
      server:
        name: engineering-bench-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: >
          Engineering Bench MCP server providing semantic search
          over engineering documentation.
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

app:
  openai-key: ${OPENAI_API_KEY}
  qdrant-host: ${QDRANT_HOST:qdrant}
  qdrant-port: ${QDRANT_PORT:6334}
  github-token: ${GITHUB_TOKEN}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}